// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
       google()
       jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}


apply plugin: 'com.android.application'


android {
    namespace 'org.icm.ficha.fichaobreiro'
    compileSdkVersion 34
    buildToolsVersion '35.0.0'
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 102410000
        versionName '1.0.0'
        manifestPlaceholders = [:]
    }

	
	packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        doNotStrip '**/*.so'
        
	}
	

	

    

    buildTypes {
        debug {
        }
        release {
            
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDir 'libs'
            java {srcDir '/home/broonoh/Workstation/ficha_obreiro/android_java_src'}
        }
    }

    aaptOptions {
        noCompress "tflite"
    }

}

dependencies {
    
}
